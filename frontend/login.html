<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Show-book-kar</title>
  <link rel="stylesheet" href="static/css/app.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="app-header" class="site-header"></header>

  <main id="main" class="page">
    <div class="auth-wrap">
      <div class="card auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in</h1>
        <p class="muted">Your bookings and held seats are tied to your account.</p>

        <div id="auth-alert" class="alert" role="alert" hidden></div>

        <form id="auth-form" class="stack" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button id="auth-submit" class="btn btn--primary btn--block" type="submit">Sign in</button>
        </form>

        <p class="auth-alt">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>
  <div id="toasts" class="toast-stack" aria-live="polite"></div>

  <script type="module" src="static/js/pages/login.js"></script>
</body>
</html>
